# CPS 853 Team 7 - Divvy data platform.
# Part 1 (Store and batch) is the spark-batch service. Parts 2-4 (Kafka,
# PostgreSQL, quality checks) get added as more services in this file.
services:
  spark-batch:
    build: .
    container_name: divvy-spark-batch
    environment:
      SPARK_DRIVER_MEMORY: 2g
      BENCH_RUNS: ${BENCH_RUNS:-5}
      SKIP_BENCHMARK: ${SKIP_BENCHMARK:-0}
    volumes:
      - ./data:/app/data # raw CSVs in, Parquet lake out
      - ./output:/app/output # Q1/Q2 answers, loaded into the database in Part 3
      - ./results:/app/results # sizes and benchmark timings for the report
    mem_limit: 3g # leaves room for Kafka + PostgreSQL on an 8 GB laptop

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: divvy-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    mem_limit: 1g
